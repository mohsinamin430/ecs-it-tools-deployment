name: build and push docker image to ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
      - 'app/**'

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
    build:
        runs-on: ubuntu-latest

        env:
          ECR_REPOSITORY: it-tools_repo
          AWS_ACCOUNT_ID: 666709165403
          IMAGE_TAG: ${{ github.sha }}
          TASK_DEFINITION_FAMILY: ecs_it_tools_task #var
          ECS_SERVICE: ecs_it_tools_service #var
          ECS_CLUSTER: ecs_it_tools #var
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
    
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v5.1.1
          with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION }}

        - name: Login to Amazon ECR
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build image
          run: |
            docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

        - name: Scan image for vulnerabilities
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            format: 'table'
            exit-code: '0'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'

        - name: Tag image
          run: |
            docker tag $ECR_REPOSITORY:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

        - name: Push image
          run: |
            docker push $AWS_ACCOUNT_ID.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

        - name: Download current task definition
          run: |
            aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_FAMILY }} \
            --query taskDefinition > task-definition.json
        
        - name: Render updated task definition
          id: render-task-def
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: task-definition.json
            container-name: it_tools_container
            image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

        - name: Deploy to ECS service
          uses: aws-actions/amazon-ecs-deploy-task-definition@v2
          with:
            task-definition: ${{ steps.render-task-def.outputs.task-definition }}
            service: ${{ env.ECS_SERVICE }}
            cluster: ${{ env.ECS_CLUSTER }}
            wait-for-service-stability: true